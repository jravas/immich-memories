immich:
  base_url: "http://192.168.178.24:2283"
  api_key: "${IMMICH_API_KEY}"
  external_url: "https://immich.pipicorp.uk"

ntfy:
  base_url: "http://ntfy:80"
  topic: "memories"

scout:
  threshold: 5
  home_gps: [45.8150, 15.9819]
  hide_action_url: "http://homelab.fritz.box:8090/hide"

filters:
  album_blacklist:
    - "Screenshots"
    - "Documents"
    - "Work"
    - "WhatsApp"
  album_dump_asset_threshold: 500
  max_album_lookups_per_memory: 12

scheduler:
  scout_cron: "0 20 * * *"
  sender_cron: "*/10 * * * *"

queue_db_path: "data/queue.sqlite"

enricher:
  enabled: true
  poll_interval_minutes: 30
  nas_url: "http://hide-server:8080"
  vision_model: "qwen2.5vl:7b"
  fallback_model: "moondream2"
  timeout_seconds: 60
  shared_secret: "${ENRICHER_SECRET}"
